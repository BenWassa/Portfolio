name: Review padded portfolio icons (batch 2)
on:
  push:
    branches:
      - fix/icon-padding-batch2
    paths:
      - .github/workflows/icon-padding-batch2.yml
      - scripts/render-icon-padding-preview.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    if: github.repository == 'BenWassa/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify five committed corrected icons
        run: node scripts/finalize-padded-icons.mjs --check
      - name: Render review contact sheet
        run: node scripts/render-icon-padding-preview.mjs
      - name: Lint
        run: npm run lint
      - name: Check format
        run: npm run format:check
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit one review image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/open/ICON-PADDING-BATCH2-PREVIEW.png
          if git diff --cached --quiet; then
            echo "Review preview unchanged."
          else
            git commit -m "docs: show five normalized app icons in a review grid"
            git push origin HEAD:fix/icon-padding-batch2
          fi
