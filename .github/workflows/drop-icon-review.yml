name: Build drop icon review asset
on:
  push:
    branches:
      - fix/drop-icon-1024
    paths:
      - .github/workflows/drop-icon-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    if: github.repository == 'BenWassa/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve existing artwork and normalize one icon
        run: |
          cp src/public/assets/projects/drop.png "$RUNNER_TEMP/drop-before.png"
          node scripts/normalize-drop-icon.mjs --write
          node scripts/normalize-drop-icon.mjs --check
      - name: Confirm drop passes the repository-wide icon audit
        run: |
          node scripts/audit-icon-corners.mjs | tee "$RUNNER_TEMP/app-icon-audit.txt"
          grep -F '| drop |' "$RUNNER_TEMP/app-icon-audit.txt" | grep -F '| ok |'
      - name: Generate before-and-after preview
        run: node scripts/render-drop-icon-preview.mjs "$RUNNER_TEMP/drop-before.png"
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Build and smoke
        run: |
          npm run build
          npm run smoke
      - name: Commit only corrected drop PNG and review image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/assets/projects/drop.png docs/open/DROP-ICON-1024-PREVIEW.png
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "fix: upscale existing drop artwork and normalize corners"
            git push origin HEAD:fix/drop-icon-1024
          fi
