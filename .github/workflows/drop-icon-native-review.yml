name: Verify native-resolution drop icon
on:
  push:
    branches:
      - fix/drop-icon-1024
    paths:
      - .github/workflows/drop-icon-native-review.yml

permissions:
  contents: write

jobs:
  render-and-verify:
    if: github.repository == 'BenWassa/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch pinned native artwork and previous card for comparison
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/BenWassa/drop/569205b3d090fe3c6b85d45f5159a68734b9b18c/docs/icons/old/drop_rounded_full.png \
            --output "$RUNNER_TEMP/drop-native.png"
          test "$(git hash-object "$RUNNER_TEMP/drop-native.png")" = 3ad4a6aa1d64499e584309ea420f544fd28ef224
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/BenWassa/Portfolio/1c8775d47bd1672a7b39ba854ac0f517824bb6b9/src/public/assets/projects/drop.png \
            --output "$RUNNER_TEMP/drop-before.png"
          test "$(git hash-object "$RUNNER_TEMP/drop-before.png")" = 9dcdb35ce035623b39d8abda93afbf293bf2dc80
          file "$RUNNER_TEMP/drop-native.png" "$RUNNER_TEMP/drop-before.png"
      - name: Apply mask to original 1024px art with no upsampling
        run: |
          node scripts/normalize-drop-icon.mjs --source "$RUNNER_TEMP/drop-native.png" --write
          node scripts/normalize-drop-icon.mjs --check
      - name: Verify portfolio audit result
        run: |
          node scripts/audit-icon-corners.mjs | tee "$RUNNER_TEMP/drop-audit.txt"
          grep -F '| drop |' "$RUNNER_TEMP/drop-audit.txt" | grep -F '| ok |'
      - name: Render actual before-and-after card preview
        run: node scripts/render-drop-icon-preview.mjs "$RUNNER_TEMP/drop-before.png"
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: TypeScript and build
        run: |
          npm run typecheck
          npm run build
          npm run smoke
      - name: Commit only native PNG and comparison image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/assets/projects/drop.png docs/open/DROP-ICON-1024-PREVIEW.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "fix: use native 1024px drop illustration with approved corners"
            git push origin HEAD:fix/drop-icon-1024
          fi
