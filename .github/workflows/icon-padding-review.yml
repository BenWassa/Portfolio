name: Validate five corrected app icons
on:
  push:
    branches:
      - fix/icon-padding-main-review
    paths:
      - .github/workflows/icon-padding-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'BenWassa/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check exact 1024px canvas, full-bleed edges and 22.5 percent masks
        run: node scripts/finalize-padded-icons.mjs --check
      - name: Check the five cards using the repo-wide auditor
        run: |
          node scripts/audit-icon-corners.mjs | tee "$RUNNER_TEMP/icon-audit.txt"
          for file in chefs-journal.png punchbuggy.png hearth.png pushup.png morpheus.png; do
            grep -F "`$file`" "$RUNNER_TEMP/icon-audit.txt" | grep -F '| ok |'
          done
      - name: Static checks and production build
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run validate:data
          npm run build
          npm run smoke
