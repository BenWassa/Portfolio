name: Portfolio health

# Network-bound check (link health + repo staleness), so it is deliberately NOT run on push or
# pull_request. It never builds, uploads or deploys Pages. Drift is surfaced twice: the run goes
# red, and a single tracking issue ("Portfolio health: drift detected") is opened or updated. The
# issue is closed again automatically once a run comes back clean.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: write is scoped to this job only so it can maintain the tracking issue.
    permissions:
      contents: read
      issues: write
    env:
      REPORT: health-report.md
      ISSUE_TITLE: 'Portfolio health: drift detected'
      ISSUE_LABEL: portfolio-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: the script uses only Node built-ins.
      - name: Check links and staleness
        id: health
        # Exit 1: a broken href/demoUrl. Exit 2 (--strict): a stale card.
        # The default token can only see this repo, so private product repos are reported as
        # "not checkable" unless PORTFOLIO_HEALTH_TOKEN (a read-only PAT) is set as a secret.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_HEALTH_TOKEN || github.token }}
        run: npm run health -- --strict --summary="$REPORT"
      - name: Publish report to the job summary
        if: always()
        run: test -s "$REPORT" && cat "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Open or update the tracking issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$REPORT" ]; then
            printf 'The health check could not run to completion. See %s.\n' "$RUN_URL" > "$REPORT"
          fi
          printf '\n---\nLast run: %s\n' "$RUN_URL" >> "$REPORT"
          gh label create "$ISSUE_LABEL" --color FBCA04 --description "Automated portfolio health findings" 2>/dev/null || true
          existing=$(gh issue list --state open --label "$ISSUE_LABEL" --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$REPORT"
            gh issue comment "$existing" --body "Still drifting as of $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$REPORT"
          fi
      - name: Close the tracking issue when clean
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --label "$ISSUE_LABEL" --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')
          [ -z "$existing" ] || gh issue close "$existing" --comment "Clean as of $RUN_URL"
      - name: Fail the run when the check found problems
        if: steps.health.outcome == 'failure'
        run: exit 1
